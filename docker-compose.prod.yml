services:
  beatz:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${BEATZ_IMAGE:-carter-beatz:latest}"
    container_name: carter-beatz
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:30142:30142"
    volumes:
      - "${BEATZ_MEDIA_ROOT:-/home/carter/beatz-selected}:/music:ro"
      - "${BEATZ_DATA_ROOT:-/home/carter/beatz-data}:/data"
    environment:
      BEATZ_DATA_ROOT: /data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
