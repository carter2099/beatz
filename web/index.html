<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta property="og:type" content="music.playlist">
    <meta property="og:title" content="Beats">
    <meta property="og:url" content="https://beats.carter2099.com/">
    <meta property="og:image" content="https://beats.carter2099.com/logo.png">
    <meta property="og:image:alt" content="Flame logo">
    <meta name="twitter:card" content="summary">
    <title>Beats</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="stylesheet" href="/assets/styles.css?v=player-1">
    <script src="/assets/app.js?v=player-1" defer></script>
  </head>
  <body class="is-loading">
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 6.6A1.6 1.6 0 0 1 4.6 5h5l2 2h7.8A1.6 1.6 0 0 1 21 8.6v9.8a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 18.4z"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.6 4.6"/></symbol>
      <symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.2c5.3 0 6.3 10 11.6 10H21m-3-3 3 3-3 3M3 17h3.2c2 0 3.4-1.5 4.6-3.4M14 8.4c1-1 2.2-1.4 3.8-1.4H21m-3-3 3 3-3 3"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path class="fill" d="m8 5 11 7-11 7z"/></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path class="fill" d="M7 5h4v14H7zm6 0h4v14h-4z"/></symbol>
      <symbol id="icon-previous" viewBox="0 0 24 24"><path class="fill" d="M6 5h2v14H6zm3 7 10-7v14z"/></symbol>
      <symbol id="icon-next" viewBox="0 0 24 24"><path class="fill" d="m5 5 10 7-10 7zm11 0h2v14h-2z"/></symbol>
      <symbol id="icon-volume" viewBox="0 0 24 24"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.2a5.3 5.3 0 0 1 0 7.6M18.7 5.5a9 9 0 0 1 0 13"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="icon-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>

    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="loading-screen" id="loading-screen" role="status" aria-label="Loading">
      <span class="loading-indicator" aria-hidden="true"></span>
    </div>

    <div class="app-shell" id="app-shell">
      <header class="site-header">
        <div class="header-inner">
          <button class="logo-button" type="button" data-view="home" aria-label="Home">
            <img src="/logo.png" alt="" width="42" height="42">
          </button>
          <nav class="site-nav" aria-label="Primary navigation">
            <button class="nav-link" type="button" data-view="explore">Explore</button>
            <button class="nav-link" type="button" data-view="search">Search</button>
          </nav>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <section class="page home-page is-active" id="home-page" aria-label="Home">
          <div class="home-panel">
            <div class="home-actions" aria-label="Main functions">
              <button class="home-action" type="button" id="shuffle-all">
                <span>Shuffle</span>
                <svg aria-hidden="true"><use href="#icon-shuffle"></use></svg>
              </button>
              <button class="home-action" type="button" data-view="explore">
                <span>Explore</span>
                <svg aria-hidden="true"><use href="#icon-arrow"></use></svg>
              </button>
              <button class="home-action" type="button" data-view="search">
                <span>Search</span>
                <svg aria-hidden="true"><use href="#icon-arrow"></use></svg>
              </button>
            </div>
          </div>
        </section>

        <section class="page explore-page" id="explore-page" aria-labelledby="explore-title" hidden>
          <header class="page-header">
            <h1 id="explore-title">Explore</h1>
          </header>

          <nav class="breadcrumbs" id="breadcrumbs" aria-label="Current folder"></nav>

          <div class="folder-toolbar" id="folder-toolbar" hidden>
            <strong id="folder-track-count">0 beats</strong>
            <button class="secondary-button" type="button" id="shuffle-folder">
              <svg aria-hidden="true"><use href="#icon-shuffle"></use></svg>
              Shuffle
            </button>
          </div>

          <div class="folder-grid" id="folder-grid"></div>
          <div class="track-section" id="explore-track-section" hidden>
            <div class="track-list-heading">
              <span>#</span><span>Title</span><span>Folder</span><span></span>
            </div>
            <div class="track-list" id="explore-track-list"></div>
          </div>
        </section>

        <section class="page search-page" id="search-page" aria-labelledby="search-title" hidden>
          <header class="page-header">
            <h1 id="search-title">Search</h1>
          </header>

          <label class="search-box" for="search-input">
            <svg aria-hidden="true"><use href="#icon-search"></use></svg>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search">
            <button type="button" id="clear-search" aria-label="Clear search" hidden>
              <svg aria-hidden="true"><use href="#icon-x"></use></svg>
            </button>
          </label>

          <div class="search-meta" id="search-meta"></div>
          <div class="track-list search-results" id="search-results"></div>
        </section>

        <section class="fatal-error" id="fatal-error" hidden aria-live="assertive">
          <strong>Unable to load.</strong>
          <button class="secondary-button" type="button" id="retry-library">Refresh</button>
        </section>
      </main>

      <footer class="player is-empty" id="player" aria-label="Music player">
        <button class="collapse-player" type="button" id="collapse-player" aria-label="Collapse player">
          <svg aria-hidden="true"><use href="#icon-down"></use></svg>
        </button>
        <button class="expand-player" type="button" id="expand-player" aria-label="Open full-screen player" aria-expanded="false"></button>
        <div class="now-playing">
          <span class="player-art" aria-hidden="true" hidden>
            <img id="player-artwork" alt="">
          </span>
          <div class="now-playing-copy">
            <div class="title-marquee" id="title-marquee" title="">
              <div class="marquee-content" id="marquee-content">
                <span id="player-title"></span>
                <span class="marquee-clone" id="marquee-clone" aria-hidden="true"></span>
              </div>
            </div>
            <div class="player-meta" id="player-meta"></div>
          </div>
        </div>

        <div class="player-center">
          <div class="player-controls">
            <button class="control-button shuffle-control" type="button" id="player-shuffle" aria-label="Turn shuffle on" aria-pressed="false">
              <svg aria-hidden="true"><use href="#icon-shuffle"></use></svg>
            </button>
            <button class="control-button" type="button" id="previous-track" aria-label="Previous beat">
              <svg aria-hidden="true"><use href="#icon-previous"></use></svg>
            </button>
            <button class="play-button" type="button" id="play-pause" aria-label="Play" disabled>
              <svg class="play-icon" aria-hidden="true"><use href="#icon-play"></use></svg>
              <svg class="pause-icon" aria-hidden="true"><use href="#icon-pause"></use></svg>
            </button>
            <button class="control-button" type="button" id="next-track" aria-label="Next beat">
              <svg aria-hidden="true"><use href="#icon-next"></use></svg>
            </button>
            <span class="control-spacer" aria-hidden="true"></span>
          </div>
          <div class="progress-row">
            <span id="current-time">0:00</span>
            <input id="seek" class="range" type="range" min="0" max="1000" value="0" aria-label="Playback position" disabled>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="volume-control">
          <svg aria-hidden="true"><use href="#icon-volume"></use></svg>
          <input id="volume" class="range" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="Volume">
        </div>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <audio id="audio" preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture></audio>
    <noscript>JavaScript is required.</noscript>
  </body>
</html>
